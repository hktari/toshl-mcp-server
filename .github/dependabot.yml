version: 2

updates:
  # Workflow actions are pinned to commit SHAs, which is the safe way to consume a
  # third-party action but freezes them at whatever was current when they were written.
  # Dependabot moves the pins forward (including for security fixes) and annotates each
  # PR with the tag it corresponds to, so the pinning has no maintenance cost.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # One PR for routine bumps keeps the noise down. Security fixes are exempted from
    # grouping by Dependabot and still arrive as their own PRs.
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # dotenv 17 prints `◇ injected env (N) from .env` to STDOUT on load. This is a
      # stdio MCP server: src/index.ts calls dotenv.config() before connecting, and the
      # client parses stdout as JSON-RPC, so that banner breaks every client with
      # `Unexpected token '◇'`. Same failure the winston transport had before #4.
      #
      # Taking dotenv 17 requires `dotenv.config({ quiet: true })` at the call site, so
      # the bump cannot land on its own. Staying on 16 until someone makes that change.
      - dependency-name: dotenv
        update-types: [version-update:semver-major]
