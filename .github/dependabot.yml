version: 2

updates:
  # Workflow actions are pinned to commit SHAs, which is the safe way to consume a
  # third-party action but freezes them at whatever was current when they were written.
  # Dependabot moves the pins forward (including for security fixes) and annotates each
  # PR with the tag it corresponds to, so the pinning has no maintenance cost.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # One PR for routine bumps keeps the noise down. Security fixes are exempted from
    # grouping by Dependabot and still arrive as their own PRs.
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # dotenv 17 prints `◇ injected env (N) from .env` to STDOUT on load. This is a
      # stdio MCP server: src/index.ts calls dotenv.config() before connecting, and the
      # client parses stdout as JSON-RPC, so that banner breaks every client with
      # `Unexpected token '◇'`. Same failure the winston transport had before #4.
      #
      # Taking dotenv 17 requires `dotenv.config({ quiet: true })` at the call site, so
      # the bump cannot land on its own. Staying on 16 until someone makes that change.
      - dependency-name: dotenv
        update-types: [version-update:semver-major]

      # TypeScript 7 is the native (Go) compiler. It no longer exposes the JavaScript
      # compiler API, and ts-jest needs that API to transform the test suites:
      #
      #   The TypeScript compiler "typescript" (version 7.0.2) does not expose the
      #   JavaScript compiler API required by ts-jest.
      #
      # So a TS 7 bump takes the whole dev-dependencies group red — it did on #20, on
      # both Node 20 and 22 — and the group cannot land until the test transform is
      # sorted out. Holding at 5 keeps the weekly group PR mergeable instead of
      # regenerating a broken one every week.
      #
      # Lifting this means moving tests off ts-jest, or adopting the
      # "@typescript/native" + "@typescript/typescript6" alias split that the error
      # message points at. Either is its own change, not a version bump.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
